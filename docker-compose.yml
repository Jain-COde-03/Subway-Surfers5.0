version: "3.9"

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: samay_backend
    restart: unless-stopped
    environment:
      # ⚠ CHANGE THIS in production — generate with: python -c "import secrets; print(secrets.token_hex(32))"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-use-a-32-byte-random-hex}
      # Set to your production domain(s) for CORS, e.g. "https://samay.railways.gov.in"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      # Override DB path so SQLite is stored in the named volume
      DB_PATH: /data/railway.db
    volumes:
      # Persist the SQLite database across container restarts/rebuilds
      - samay_db:/data
      # Persist model files (the .joblib) without rebuilding
      - ./backend/models:/app/backend/models:ro
      - ./src/backend/models:/app/backend/models:ro
      # Persist input CSVs
      - ./backend/data:/app/backend/data:ro
      - ./src/backend/data:/app/backend/data:ro
    networks:
      - samay_network
    # No published ports — Nginx is the only public entry point
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx + React Frontend ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: samay_frontend
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP on port 80
      # - "443:443"   # Uncomment and add SSL cert volume for HTTPS
    networks:
      - samay_network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  samay_db:
    # Named volume — survives `docker-compose down` (data is NOT deleted)
    # To wipe the DB: docker volume rm subway_surfers_samay_db

networks:
  samay_network:
    driver: bridge

