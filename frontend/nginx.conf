server {
    listen 80;
    server_name _;

    # ── Serve React SPA ───────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any route not matching a static file → serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy /api/* → FastAPI backend ────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass cookies through unchanged
        proxy_pass_header  Set-Cookie;
        proxy_cookie_path  / /;
    }

    # ── Proxy /generate-plan → FastAPI backend ────────────────────────────────
    location /generate-plan {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Cache static assets aggressively ─────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;

    # Increase body size limit for file uploads / large plan responses
    client_max_body_size 20M;
}

